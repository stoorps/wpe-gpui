[workspace]
members = ["crates/wpe-bridge", "crates/gpui-wpe", "crates/email-renderer", "examples/browser-demo", "examples/embedding"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
gpui = { package = "gpui-kit", version = "=0.8.1", default-features = false, features = ["gpui-fast"] }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.12", default-features = false, features = ["wayland"] }

[profile.dev]
debug = 0
