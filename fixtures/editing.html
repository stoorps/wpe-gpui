<!doctype html><meta charset="utf-8"><title>Input interoperability lab</title><style>body{font:18px system-ui;margin:36px;line-height:1.6;background:#f7fafc;color:#142332}input,textarea,[contenteditable]{display:block;width:90%;padding:14px;margin:14px 0;font:inherit;border:1px solid #9aaebb;background:white}pre{background:#142332;color:#bde8d7;padding:20px;white-space:pre-wrap}section{margin-bottom:32px}footer{margin-top:700px}</style><h1>GPUI ↔ WPE input lab</h1><p>Select this text, copy it into the GPUI address bar, then paste text back here.</p><label>Single-line input<input placeholder="Type, select, cut, copy and paste"></label><label>Textarea<textarea rows="4">Try accented text, emoji 👋, and multiple lines.</textarea></label><div contenteditable="true">Editable rich text — try keyboard selection and undo.</div><a href="demo://second/">Navigate to second page</a> · <a href="demo://second/" target="_blank">Open in new tab</a><h2>Recent DOM events</h2><pre id="events">Click a field to begin.</pre><footer>Bottom of the scrolling test</footer><script>let log=[];for(const name of ['keydown','keyup','beforeinput','input','compositionstart','compositionupdate','compositionend','copy','cut','paste','focusin','focusout'])document.addEventListener(name,e=>{log.unshift(name+' '+(e.key||e.data||e.target.tagName));document.querySelector('#events').textContent=log.slice(0,12).join('\n')},true)</script>
