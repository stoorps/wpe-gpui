[package]
name = "gpui-wpe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/stoorps/wpe-gpui-fast"
rust-version = "1.98.1"
description = "Native Wayland WPE WebKit views for GPUI Fast"
[features]
native-failure-injection = ["wpe-bridge/native-failure-injection"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
wpe-bridge = { path = "../wpe-bridge", version = "=0.1.0" }
raw-window-handle = "0.6"
